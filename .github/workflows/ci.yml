name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      # Genereert convex/_generated/* (gitignored). Nodig voor tsc + tests.
      - run: npx convex codegen --typecheck=disable
      - run: npm run typecheck
      - run: npm test
