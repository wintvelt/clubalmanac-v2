<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- Linkvoorbeeld in WhatsApp en Signal (Open Graph). Het plaatje maakt scripts/build-share-image.mjs. -->
    <meta name="description" content="Het fotoalbum van je club. Log in met je e-mailadres en een code." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Clubalmanac" />
    <meta property="og:title" content="Clubalmanac" />
    <meta property="og:description" content="Het fotoalbum van je club. Log in met je e-mailadres en een code." />
    <meta property="og:url" content="https://app.clubalmanac.com/" />
    <meta property="og:image" content="https://app.clubalmanac.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="nl_NL" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Standaard van Expo: de stijl-reset van react-native-web. -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>Zet JavaScript aan om Clubalmanac te gebruiken.</noscript>
    <div id="root"></div>
  </body>
</html>
